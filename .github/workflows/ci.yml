name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # linux-x64 + windows-x64. macOS is NOT in this matrix: the unit suite has
        # a known cluster of macOS-local temp-path/parallel-load flakes that would
        # make a macOS leg permanently red. macOS arm64 is covered by maintainer
        # runs; macOS x64 is intentionally untested. Platform-sensitive daemon
        # behavior that must hold everywhere (e.g. the borrowed-review capability
        # advertisement, which no longer carries any OS/arch precondition) is
        # additionally pinned by host-independent source guards in the unit suite —
        # see DaemonRunnerCursorAvailabilityTests' platform coverage matrix.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build solution
        run: dotnet build Capacitor.slnx

      - name: Run npm wrapper tests
        # Plain-Node assertion scripts for the npm launcher/refresh/resolve
        # modules (no test framework, no npm install). `shell: bash` gives
        # fail-fast -e semantics on both matrix legs.
        shell: bash
        run: |
          node npm/kcap/bin/kcap.test.js
          node npm/kcap/bin/resolve.test.js
          node npm/kcap/bin/refresh.test.js

      - name: Run unit tests
        # --maximum-parallel-tests 1 does NOT serialize the entire suite.
        # It caps TUnit's parallel bucket (unattributed tests) at one, but
        # keyed [NotInParallel("key")] tests are scheduled by the
        # constraint-key scheduler, which starts every test whose keys are
        # free WITHOUT consulting this cap — classes with disjoint key
        # sets still run concurrently under this flag (verified against
        # TUnit 1.18.37's TestScheduler/ConstraintKeyScheduler). So any
        # test touching process-global state (Environment/Console,
        # CliTelemetry/TelemetryState statics, the shared KCAP_CONFIG_DIR)
        # must hold the SAME NotInParallel key as every other toucher of
        # that state; this flag only quiets the unkeyed bucket. Local dev
        # runs stay parallel (the flag lives only in CI).
        run: dotnet run --project test/Capacitor.Cli.Tests.Unit/Capacitor.Cli.Tests.Unit.csproj -- --maximum-parallel-tests 1

      - name: Run app tests
        # Same flag, same caveat as the unit suite: the app tests share process-global
        # Avalonia/Rx state behind [NotInParallel("AvaloniaSession")].
        run: dotnet run --project test/Capacitor.App.Tests.Unit/Capacitor.App.Tests.Unit.csproj -- --maximum-parallel-tests 1

      - name: Run integration tests
        # Linux only: the integration suite does real loopback HTTP (WireMock).
        # On the Windows runner an https probe against the plain-HTTP test server
        # (localhost/::1 resolution + TLS-to-HTTP) is environment-flaky. The
        # cross-platform correctness that matters on Windows (path handling, the
        # AI-820 watcher handle test) lives in the unit suite above. See AI-820.
        if: runner.os == 'Linux'
        run: dotnet run --project test/Capacitor.Cli.Tests.Integration/Capacitor.Cli.Tests.Integration.csproj

  lint-linear-ids:
    name: No Linear issue IDs in C# source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for Linear issue ID tokens in src/**/*.cs and test/**/*.cs
        run: bash scripts/check-linear-ids.sh

  aot-check:
    name: AOT publish check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - src/Capacitor.Cli/Capacitor.Cli.csproj
          - src/Capacitor.Cli.Daemon/Capacitor.Cli.Daemon.csproj

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish AOT (linux-x64)
        run: dotnet publish ${{ matrix.project }} -c Release -r linux-x64

      - name: Check for trimming warnings
        run: |
          OUTPUT=$(dotnet publish ${{ matrix.project }} -c Release -r linux-x64 2>&1)
          if echo "$OUTPUT" | grep -E 'IL[23][01][0-9]{2}'; then
            echo "::error::AOT/trimming warnings detected"
            echo "$OUTPUT" | grep -E 'IL[23][01][0-9]{2}'
            exit 1
          fi
