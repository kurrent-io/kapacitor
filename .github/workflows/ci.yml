name: CI

on:
  pull_request:
    # Skip markdown-only PRs, EXCEPT under kcap/ — every file in the shipped plugin is a SKILL.md, so
    # adding a skill is a markdown-only change. Ignoring those let two skills ship unlisted in
    # AgentsSkillsInstaller.SourceNames without a red build; the guard that now catches it only helps
    # if it runs on the PR that causes it. Order matters: later patterns re-include.
    paths:
      - '**'
      - '!**.md'
      - 'kcap/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
    tags:
      - 'v*'

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # linux-x64 + windows-x64. macOS is NOT in this matrix: the unit suite has
        # a known cluster of macOS-local temp-path/parallel-load flakes that would
        # make a macOS leg permanently red. macOS arm64 is covered by maintainer
        # runs; macOS x64 is intentionally untested. Platform-sensitive daemon
        # behavior that must hold everywhere (e.g. the borrowed-review capability
        # advertisement, which no longer carries any OS/arch precondition) is
        # additionally pinned by host-independent source guards in the unit suite —
        # see DaemonRunnerCursorAvailabilityTests' platform coverage matrix.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          cache: true
          # No lock file to key on; CPM makes this the one file that pins every version.
          cache-dependency-path: Directory.Packages.props

      # Whole solution in every cached job: one OS-keyed immutable entry, so a job that
      # restored a subset would win the race and freeze the cache on it.
      - name: Restore solution
        run: dotnet restore Capacitor.slnx

      - name: Build solution
        run: dotnet build Capacitor.slnx --no-restore

      - name: Run npm wrapper tests
        # Plain-Node assertion scripts for the npm launcher/refresh/resolve
        # modules (no test framework, no npm install). `shell: bash` gives
        # fail-fast -e semantics on both matrix legs.
        shell: bash
        run: |
          node npm/kcap/bin/kcap.test.js
          node npm/kcap/bin/resolve.test.js
          node npm/kcap/bin/refresh.test.js

      - name: Run shell script tests
        if: runner.os == 'Linux'
        run: bash scripts/run-shell-tests.sh

      - name: Run tests
        # --max-parallel-test-modules 1 runs one assembly at a time. Two things block lifting it,
        # both measured with it off: five concurrent assemblies starve the tests that assert a
        # wall-clock budget on the two-core Windows runner (a 1s cap measured 1.004s), and an
        # Integration test's temp working directory vanished mid-test on Linux — a cross-assembly
        # sharing point no in-assembly [NotInParallel] key can serialise. It halves CI wall-clock,
        # so it is worth another attempt once budget assertions take an injected clock.
        # --maximum-parallel-tests caps only TUnit's unkeyed bucket — keyed
        # [NotInParallel] tests still run concurrently with disjoint-key classes, so
        # anything touching process-global state must hold the SAME key as every other
        # toucher. A cap of 1 narrows race windows rather than closing them, so it hides
        # a missing key instead of failing on it; 4 is wide enough to surface one.
        # Local dev runs stay parallel; both flags live only in CI.
        run: dotnet test --solution Capacitor.slnx --no-build --max-parallel-test-modules 1 -- --maximum-parallel-tests 4

  lint-linear-ids:
    name: No Linear issue IDs in C# source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for Linear issue ID tokens in src/**/*.cs and test/**/*.cs
        run: bash scripts/check-linear-ids.sh

  aot-check:
    name: AOT publish check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - src/Capacitor.Cli/Capacitor.Cli.csproj
          - src/Capacitor.Cli.Daemon/Capacitor.Cli.Daemon.csproj

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          cache: true
          # No lock file to key on; CPM makes this the one file that pins every version.
          cache-dependency-path: Directory.Packages.props

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # Whole solution, and the RID pulls ILCompiler — a superset of build-and-test's set.
      - name: Restore solution
        run: dotnet restore Capacitor.slnx -r linux-x64

      - name: Publish AOT (linux-x64)
        run: dotnet publish ${{ matrix.project }} -c Release -r linux-x64 --no-restore

      - name: Check for trimming warnings
        run: |
          OUTPUT=$(dotnet publish ${{ matrix.project }} -c Release -r linux-x64 --no-restore 2>&1)
          if echo "$OUTPUT" | grep -E 'IL[23][01][0-9]{2}'; then
            echo "::error::AOT/trimming warnings detected"
            echo "$OUTPUT" | grep -E 'IL[23][01][0-9]{2}'
            exit 1
          fi

  app-bundle:
    name: App bundle (osx-arm64)
    runs-on: macos-latest
    steps:
      # Full history and tags: MinVer derives the version from the nearest tag, and the app
      # refuses a bundled CLI below its floor — a shallow checkout would compute a below-floor
      # default version and fail the assertion below on every PR.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      - name: Install tools
        run: |
          dotnet tool install -g minver-cli --version 7.0.0
          dotnet tool install -g vpk --version 1.2.0

      # One version for the daemon, the CLI, the app and the package, so the floor assertion and
      # Velopack's SemVer check see the same value. The standalone tool does not read
      # MinVerTagPrefix from Directory.Build.props, hence the explicit prefix.
      - name: Compute version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          FULL="$(minver --tag-prefix v)"
          echo "VERSION=${FULL%%+*}" >> "$GITHUB_OUTPUT"
          echo "computed $FULL"

      - name: Publish daemon
        run: >
          dotnet publish src/Capacitor.Cli.Daemon/Capacitor.Cli.Daemon.csproj -c Release -r osx-arm64
          -p:MinVerVersionOverride=${{ steps.version.outputs.VERSION }} -o publish/daemon/

      - name: Compute daemon digest
        id: daemon-digest
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/hash.sh
          DIGEST="$(sha256_of publish/daemon/kcap-daemon)"
          echo "DIGEST=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "$DIGEST" > publish/daemon.sha256

      - name: Publish CLI
        run: >
          dotnet publish src/Capacitor.Cli/Capacitor.Cli.csproj -c Release -r osx-arm64
          -p:MinVerVersionOverride=${{ steps.version.outputs.VERSION }}
          -p:KcapDaemonDigest=${{ steps.daemon-digest.outputs.DIGEST }} -o publish/cli/

      - name: Publish app
        run: >
          dotnet publish src/Capacitor.App/Capacitor.App.csproj -c Release -r osx-arm64 --self-contained
          -p:MinVerVersionOverride=${{ steps.version.outputs.VERSION }} -o publish/app/

      - name: Assemble pack directory
        shell: bash
        run: |
          set -euo pipefail
          cp publish/cli/kcap publish/daemon/kcap-daemon publish/daemon/libpty_shim.dylib publish/app/
          chmod +x publish/app/kcap publish/app/kcap-daemon "publish/app/Kurrent Capacitor"
          bash scripts/render-info-plist.sh "${{ steps.version.outputs.VERSION }}" publish/Info.plist

      - name: Pack (unsigned)
        shell: bash
        run: >
          vpk pack --packId KurrentCapacitor --packVersion "${{ steps.version.outputs.VERSION }}"
          --packTitle "Kurrent Capacitor" --packAuthors Kurrent --mainExe "Kurrent Capacitor"
          --packDir publish/app --plist publish/Info.plist --icon src/Capacitor.App/Assets/kcap-icon.icns
          --channel osx-arm64 --noInst --outputDir releases

      - name: Assert the bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          ditto -x -k releases/KurrentCapacitor-osx-arm64-Portable.zip extracted
          APP="extracted/Kurrent Capacitor.app"
          bash scripts/assert-app-cli-version.sh "$APP/Contents/MacOS/kcap" "${{ steps.version.outputs.VERSION }}"
          bash scripts/assert-bundle-digest.sh "$APP" publish/daemon.sha256
          "$APP/Contents/MacOS/kcap" --version --no-update-check
          "$APP/Contents/MacOS/kcap-daemon" --version
          # Pins the manifest field names the alias-promotion script depends on.
          bash scripts/promote-desktop-aliases.sh releases/releases.osx-arm64.json "${{ steps.version.outputs.VERSION }}" | grep -qx beta

      - name: Upload unsigned bundle
        uses: actions/upload-artifact@v7
        with:
          name: app-osx-arm64-unsigned
          path: releases/KurrentCapacitor-osx-arm64-Portable.zip
